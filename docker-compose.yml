services:
  # Use this for external databases (Supabase, Neon, etc.)
  # Command: docker-compose --profile external-db up
  app:
    profiles: ["external-db"]
    # Configurable container name allows running multiple instances
    container_name: ${CONTAINER_NAME:-remote-agent-app}
    build:
      context: .
      args:
        # Pass PORT to container so app binds to correct port internally
        - PORT=${PORT:-3000}
    env_file: .env
    ports:
      # Both host and container use same port for proper app binding
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - ${WORKSPACE_PATH:-./workspace}:/workspace
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 8.8.4.4
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1

  # Use this for local Docker database
  # Command: docker-compose --profile with-db up
  app-with-db:
    profiles: ["with-db"]
    # Append -with-db suffix to avoid container name conflicts with external-db profile
    container_name: ${CONTAINER_NAME:-remote-agent-app}-with-db
    build:
      context: .
      args:
        # Pass PORT to container so app binds to correct port internally
        - PORT=${PORT:-3000}
    env_file: .env
    environment:
      # Override DATABASE_URL to use Docker service name
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/remote_coding_agent
    ports:
      # Both host and container use same port for proper app binding
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - ${WORKSPACE_PATH:-./workspace}:/workspace
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 8.8.4.4
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    profiles: ["with-db"]
    # Configurable postgres container name allows sharing database across multiple app instances
    container_name: ${POSTGRES_CONTAINER_NAME:-remote-agent-postgres}
    environment:
      POSTGRES_DB: remote_coding_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      # Configurable data volume: uses named volume 'postgres_data' by default,
      # or bind mount to custom path when POSTGRES_DATA_VOLUME is set to a directory path
      - ${POSTGRES_DATA_VOLUME:-postgres_data}:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  # Named volume for PostgreSQL data (used when POSTGRES_DATA_VOLUME=postgres_data or unset)
  # If POSTGRES_DATA_VOLUME is set to a path (e.g., ./data/postgres-dev), a bind mount is used instead
  postgres_data:
